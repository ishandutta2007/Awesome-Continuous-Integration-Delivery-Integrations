<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .pulsing-orb-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .pulsing-orb-2 {
        transform-origin: 1000px 320px;
        animation: pulseGlow 9s ease-in-out infinite reverse;
      }
      .pipeline-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 2s linear infinite;
      }
      .node-float {
        animation: floatNode 4s ease-in-out infinite;
      }
      .node-float-2 {
        animation: floatNode 4s ease-in-out infinite 2s;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Ambience (Behind everything) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" class="pulsing-orb-1" />
  <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)" class="pulsing-orb-2" />

  <!-- Dynamic Pipeline Visual Flow (Subtle in Background) -->
  <g opacity="0.35">
    <path d="M 120 330 C 350 330, 450 370, 600 370 C 750 370, 850 330, 1080 330" fill="none" stroke="#38bdf8" stroke-width="2.5" class="pipeline-line" />
    
    <!-- Stage Nodes -->
    <g transform="translate(140, 330)" class="node-float">
      <circle r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle r="5" fill="#38bdf8" />
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">SOURCE</text>
    </g>
    <g transform="translate(420, 350)" class="node-float-2">
      <circle r="14" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle r="5" fill="#818cf8" />
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">BUILD &amp; TEST</text>
    </g>
    <g transform="translate(760, 350)" class="node-float">
      <circle r="14" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
      <circle r="5" fill="#a855f7" />
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">DEPLOY</text>
    </g>
    <g transform="translate(1040, 330)" class="node-float-2">
      <circle r="14" fill="#0f172a" stroke="#34d399" stroke-width="2" />
      <circle r="5" fill="#34d399" />
      <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">OBSERVE</text>
    </g>
  </g>

  <!-- Foreground Pill Badges -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Category Pill -->
    <rect x="-190" y="-18" width="380" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="1.2" opacity="0.9" />
    <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">⚡ CI/CD &amp; DEVOPS ECOSYSTEM</text>
  </g>

  <!-- Foreground Clear Title & Subtitle -->
  <g transform="translate(600, 160)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.8">
      Awesome Continuous Integration &amp; Delivery
    </text>
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="url(#accentGrad)" letter-spacing="0.2">
      Curated Pipeline Orchestration, GitOps Engines &amp; Deployment Automations
    </text>
    <text y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8">
      Enterprise SaaS Platforms • Self-Hosted Runners • Cloud-Native Open-Source Frameworks
    </text>
  </g>

  <!-- Feature Highlights / Tags -->
  <g transform="translate(600, 290)" text-anchor="middle">
    <g transform="translate(-320, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#bae6fd" font-weight="600">📦 Build Automation</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c7d2fe" font-weight="600">🚀 GitOps Delivery</text>
    </g>
    <g transform="translate(100, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#f3e8ff" font-weight="600">☸️ Kubernetes Native</text>
    </g>
    <g transform="translate(310, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1" />
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#a7f3d0" font-weight="600">🛡️ DevSecOps Ready</text>
    </g>
  </g>
</svg>
